<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png" type="image/png" />
</head>
<body>
  <div class="controls">
    <label for="setSelect">Select a Deck:</label>
    <select id="setSelect"></select>
  </div>

  <div class="flashcard-container">
    <div id="flashcard" class="flashcard">
      <div class="card-face front" id="card-front">Loading...</div>
      <div class="card-face back" id="card-back"></div>
    </div>
  </div>

  <div class="nav-buttons">
    <button id="prevBtn">Previous Term</button>
    <button id="nextBtn">Next Term</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
