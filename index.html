<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Dropdown to select different definition sets -->
  <div class="controls">
    <label for="setSelect">Select a Deck:</label>
    <select id="setSelect"></select>
  </div>

  <div class="flashcard-container">
    <div id="flashcard" class="flashcard">Click to reveal definition</div>
  </div>

  <!-- Navigation buttons -->
  <div class="nav-buttons">
    <button id="prevBtn">Previous Term</button>
    <button id="nextBtn">Next Term</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
